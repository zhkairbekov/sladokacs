  />
  <!-- Ленточки бантика снизу -->
  <path
    d="M29 33L20 48L26.5 46.5L31 36.5L29 33ZM35 33L44 48L37.5 46.5L33 36.5L35 33Z"
    fill="url(#pinkGrad)"
  />
  <!-- Центральный узелок бантика -->
  <circle cx="32" cy="31.5" r="4.2" fill="#ffffff" />

  <!-- Маленькая искорка сверху справа -->
